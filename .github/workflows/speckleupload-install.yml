name: SpeckleUpload Install Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit_version: ["2022", "2024", "2026"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SpeckleUpload.sln -p:RevitVersion=${{ matrix.revit_version }}

      - name: Build
        run: dotnet build SpeckleUpload.sln -c Release --no-restore -p:RevitVersion=${{ matrix.revit_version }}

      - name: Stage install bundle
        shell: pwsh
        env:
          REVIT_VERSION: ${{ matrix.revit_version }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "install-bundle"
          $tfm = if ($env:REVIT_VERSION -eq "2026") { "net8.0-windows" } else { "net48" }
          $bin = Join-Path $env:GITHUB_WORKSPACE "bin\$env:REVIT_VERSION\Release\$tfm"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -Path (Join-Path $bin "*") -Destination $out -Recurse -Force

          switch ($env:REVIT_VERSION) {
            "2024" {
              Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "SpeckleUpload.Revit2024.addin") -Destination (Join-Path $out "SpeckleUpload.addin") -Force
            }
            "2026" {
              Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "SpeckleUpload.Revit2026.addin") -Destination (Join-Path $out "SpeckleUpload.addin") -Force
            }
            default {
              Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "SpeckleUpload.addin") -Destination $out -Force
            }
          }

          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Install-SpeckleUpload.ps1") -Destination $out -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Install-SpeckleUpload.cmd") -Destination $out -Force
          if ($env:REVIT_VERSION -eq "2024") {
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Install-SpeckleUpload-2024.cmd") -Destination $out -Force
          }
          if ($env:REVIT_VERSION -eq "2026") {
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Install-SpeckleUpload-2026.cmd") -Destination $out -Force
          }

          Write-Host "Bundle contents ($env:REVIT_VERSION):"
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }

      - name: Pack install bundle
        shell: pwsh
        env:
          REVIT_VERSION: ${{ matrix.revit_version }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          $shortSha = $env:GIT_SHA.Substring(0, 6)
          $zipName = "speckle-upload-$env:REVIT_VERSION-${timestamp}-${shortSha}.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          $bundle = Join-Path $env:GITHUB_WORKSPACE "install-bundle"

          @(
            "product=SpeckleUpload",
            "revit_version=$env:REVIT_VERSION",
            "built_at=$timestamp",
            "commit=$env:GIT_SHA",
            "commit_short=$shortSha",
            "ref=$env:GIT_REF"
          ) | Set-Content -Path (Join-Path $bundle "BUILD_INFO.txt") -Encoding UTF8

          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $bundle "*") -DestinationPath $zipPath -Force

          Write-Host "Created package: $zipName"
          "PACKAGE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ZIP }}
          path: ${{ github.workspace }}/${{ env.PACKAGE_ZIP }}
